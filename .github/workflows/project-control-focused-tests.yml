name: Project Control focused tests

on:
  push:
    branches:
      - ai-project-control-integration
  pull_request:
    branches:
      - ai-project-control-integration
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test runner and Excel reader
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r ai_project_control/requirements.txt
      - name: Compile root app, pages and application modules
        run: python -m compileall -q app.py ai_project_control pages
      - name: Run focused project-control tests
        run: |
          python -m pytest -q \
            tests/test_project_director_decision_matrix.py \
            tests/test_project_director_review.py \
            tests/test_portfolio_command_center.py \
            tests/test_portfolio_health_monitoring.py \
            tests/test_executive_action_register.py \
            tests/test_project_recovery_control.py \
            tests/test_recovery_scenario_comparator.py \
            tests/test_integrated_executive_report.py \
            tests/test_integrated_project_intelligence.py \
            tests/test_telegram_executive_reporting.py \
            tests/test_telegram_notifications.py \
            tests/test_telegram_document_intake.py \
            tests/test_executive_report_export.py \
            tests/test_data_quality_validation.py \
            tests/test_import_mapping.py \
            tests/test_upload_reader.py \
            tests/test_primary_app_smoke.py \
            tests/test_advanced_import_service.py \
            tests/test_dashboard_metrics_regressions.py \
            tests/test_project_store.py \
            tests/test_workspace_config.py \
            tests/test_import_service.py \
            tests/test_workspace_service.py \
            tests/test_evm_engine.py \
            tests/test_schedule_engine.py \
            tests/test_schedule_forecast.py \
            tests/test_resource_optimization.py \
            tests/test_resource_loading_summary.py \
            tests/test_manpower_equipment_planner.py \
            tests/test_boq_schedule_resource_integration.py \
            tests/test_cost_forecast.py \
            tests/test_risk_cost_simulation.py \
            tests/test_action_register_store.py \
            tests/test_action_escalation.py \
            tests/test_portfolio_monitoring.py \
            tests/test_project_recovery_intelligence.py \
            tests/test_recovery_execution.py \
            tests/test_recovery_effectiveness.py \
            tests/test_recovery_evm_bridge.py \
            tests/test_schedule_cost_outlook.py \
            tests/test_schedule_risk_simulation.py \
            tests/test_risk_adjusted_project_outlook.py \
            tests/test_risk_exposure_matrix.py \
            tests/test_recovery_resource_planner.py \
            tests/test_recovery_decision_engine.py \
            tests/test_predictive_early_warning.py \
            tests/test_project_performance_history.py \
            tests/test_historical_ml_training.py \
            tests/test_risk_mitigation_store.py \
            tests/test_risk_governance_bridge.py \
            tests/test_portfolio_risk_resource_intelligence.py \
            tests/test_portfolio_workspace_intelligence.py \
            tests/test_coo_portfolio_decision_brief.py \
            tests/test_portfolio_cashflow_intelligence.py \
            tests/test_portfolio_cashflow_workspace.py \
            tests/test_dated_cashflow_forecast.py \
            tests/test_financial_control_brief.py \
            tests/test_financial_workspace_service.py \
            tests/test_portfolio_workspace_service.py \
            tests/test_workspace_backup.py \
            tests/test_backup_workspace_script.py \
            tests/test_project_workspace_page.py \
            tests/test_workspace_dashboard_display.py
      - name: Run complete repository test suite
        run: python -m pytest -q
