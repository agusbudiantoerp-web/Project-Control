name: AI Project Control automated tests

on:
  push:
    branches: [ai-project-control-integration]
    paths:
      - "ai_project_control/**"
      - ".github/workflows/ai-project-control-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "ai_project_control/**"
      - ".github/workflows/ai-project-control-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_project_control
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_project_control/requirements.txt
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run deterministic engine tests
        run: python -m pytest -q tests
