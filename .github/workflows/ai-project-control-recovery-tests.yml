name: AI Project Control Recovery Tests

on:
  push:
    branches:
      - ai-project-control-integration
  pull_request:
    branches:
      - ai-project-control-integration
  workflow_dispatch:

jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_project_control
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_project_control/requirements.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas numpy
      - name: Run recovery engine regression tests
        run: >
          python -m pytest -q
          tests/test_recovery_scenario_optimizer.py
          tests/test_integrated_recovery_impact.py
          tests/test_executive_recovery_strategies.py
          tests/test_executive_command_center.py
          tests/test_portfolio_resource_transfer.py
          tests/test_portfolio_governance.py
